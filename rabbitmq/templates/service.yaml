apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: roboshop
  labels:
    project: roboshop
    tier: database
    component: rabbitmq
    environment: dev
spec:
  selector:
      project: roboshop
      tier: database
      component: rabbitmq
      environment: dev

  ports:
  - protocol: TCP
    port: 5672
    targetPort: 5672
