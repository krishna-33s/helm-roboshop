apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    tier: database
    component: mysql
    environment: dev
spec:
  selector:
      project: roboshop
      tier: database
      component: mysql
      environment: dev

  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306
